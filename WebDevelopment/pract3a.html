<html>
<head>
<title>Table</title>
<style>
* {
   margin-top : 20px;
}
body {
    font-size: 50px;
    background-color: pink;
}
table {
    background-color : indigo;
    border : 4px solid black;
    border-collapse: collapse;
    font-size: 50px; 
    margin: auto; 
    text-align: center;
}
th, td {
    border : 4px solid black;
    padding: 20px;
}
caption {
    font-weight: bold;
    font-size: 60px; 
    margin-bottom: 10px; 
}
</style>
</head>
<body>
<table>
<caption>Employees</caption>
<tr bgcolor="red">
<th>Name</th>
<th>Age</th>
<th>Salary</th>
</tr>
<tr bgcolor="cyan">
<td>Kun</td>
<td>18</td>
<td>100000</td>
</tr>
<tr bgcolor="indigo">
<td style="color: white;">B</td>
<td style="color: white;">18</td>
<td style="color: white;">85000</td>
</tr>
<tr bgcolor="lime">
<td>S</td>
<td>17</td>
<td>70000</td>
</tr>
</table>
</body>
</html>
