<script lang = "javascript">
console.log("For Loop");
for(let i = 0; i < 11; i++)
console.log(i);

console.log("While Loop");
let i = 1;
while(i < 11) {
	console.log(i);
	i++;
}

console.log("Do-While Loop");
let j = 1;
do {
	console.log(j);
	j++;
} while(j < 11);

console.log("For In Loop");
let ob = {name : "Kunal", age : "18"}
for(let key in ob) {
	console.log(key + " " + ob[key]);
}
