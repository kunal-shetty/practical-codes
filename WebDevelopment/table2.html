<html>
<head>
<title>Colspan and Rowspan</title>
<style>
* {
	font-size : 40px;
}
td, th {
	font-size : 40px;
	border : 8px solid red;
}
table {
	margin : auto;
	border-collapse : collapse;
}
caption { 
	margin-bottom : 10px;
}
</style>
</head>
<body bgcolor = "lightgreen">
<table>
<caption><b>Colspan</b></caption>
<tr>
<th>Name</th>
<th colspan = "2">Contact</th>
</tr>
<tr>
<td>John</td>
<td>1234567890</td>
<td>8652923145</td>
</tr>
</table>
</body>
</html>
