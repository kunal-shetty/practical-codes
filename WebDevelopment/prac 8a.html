<!DOCTYPE html>
<html>
<head>
<title>Prime Numbers</title>
<body bgcolor="#E099FF">
<script>
const num = 100;
function isPrime(num) {
	for(let i = 2; i < num/2; i++) {
		if(num % i == 0)
		return false;
	}
	return true;
}
for(let i = 2; i < num; i++) {
	if(isPrime(i))
	document.write(i + "<br>");
}
</script>
</head>
</html>
