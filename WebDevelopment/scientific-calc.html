<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: all 0.5s ease-in-out;
        }
        .calculator {
            width: 350px;
            padding: 10px;
            border: 3px solid black;
            border-radius: 10px;
            background: #F19AE8;
            transition: width 0.5s ease-in-out;
            display: grid;
            gap: 5px;
        }
        input {
            width: 100%;
            height: 80px;
            padding: 10px;
            background: #9AE8F1;
            color: #000;
            border: 3px solid black;
            border-radius: 10px;
            text-align: right;
            font-size: 45px;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .scientific {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .landscape {
            width: 500px !important;
        }
        .landscape .button-grid {
            grid-template-columns: repeat(5, 1fr);
        }
        .landscape .scientific {
            display: grid;
        }
        button {
            height: 60px;
            background: #E8F19A;
            border: 3px solid black;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }
        #rotateBtn {
            background: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator" id="calculator">
            <input type="text" id="display" readonly>
            
            <div class="scientific" id="scientificButtons">
                <button onclick="appendValue('Math.PI')">π</button>
                <button onclick="appendValue('Math.E')">e</button>
                <button onclick="appendValue('Math.sqrt(')">√</button>
                <button onclick="appendValue('Math.pow(')">x^y</button>
                <button onclick="appendValue('Math.log10(')">log</button>
                <button onclick="appendValue('Math.log(')">ln</button>
                <button onclick="appendValue('Math.sin(')">sin</button>
                <button onclick="appendValue('Math.cos(')">cos</button>
                <button onclick="appendValue('Math.tan(')">tan</button>
                <button onclick="appendValue('Math.asin(')">asin</button>
                <button onclick="appendValue('Math.acos(')">acos</button>
                <button onclick="appendValue('Math.atan(')">atan</button>
                <button onclick="appendValue('(')">(</button>
                <button onclick="appendValue(')')">)</button>
            </div>

            <div class="button-grid">
                <button onclick="clearDisplay()">C</button>
                <button onclick="deleteLast()">DEL</button>
                <button onclick="applyPercentage()">%</button>
                <button onclick="appendValue('/')">÷</button>
                <button onclick="appendValue('*')">×</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button onclick="appendValue('-')">-</button>
                <button onclick="appendValue('+')">+</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button onclick="appendValue('.')">.</button>
                <button onclick="appendValue('0')">0</button>

                <button onclick="calculate()">=</button>
                <button id="rotateBtn" onclick="toggleLandscape()">🔄</button>
            </div>
        </div>
    </div>

    <script>
        function appendValue(value) {
            let display = document.getElementById("display");
            display.value += value;
        }

        function clearDisplay() {
            document.getElementById("display").value = "";
        }

        function deleteLast() {
            let display = document.getElementById("display");
            display.value = display.value.slice(0, -1);
        }

        function applyPercentage() {
            let display = document.getElementById("display");
            let expression = display.value;

            let match = expression.match(/(\d+(\.\d+)?)$/);
            if (match) {
                let num = parseFloat(match[0]);
                let percentageValue = num / 100;
                display.value = expression.replace(/(\d+(\.\d+)?)$/, percentageValue);
            }
        }

        function calculate() {
            let display = document.getElementById("display");
            try {
                let result = eval(display.value);
                if (!isFinite(result)) throw "Invalid Expression";
                display.value = parseFloat(result.toFixed(10)); 
            } catch {
                display.value = "Error";
                setTimeout(() => (display.value = ""), 1000);
            }
        }

        document.addEventListener("keydown", function(event) {
            let display = document.getElementById("display");
            if (event.key === "Enter") {
                calculate();
            } else if (event.key === "Backspace") {
                deleteLast();
            } else if (!isNaN(event.key) || ["+", "-", "*", "/", ".", "(", ")"].includes(event.key)) {
                appendValue(event.key);
            } else if (event.key === "%") {
                applyPercentage();
            }
        });

        function toggleLandscape() {
            let calculator = document.getElementById("calculator");
            let scientificButtons = document.getElementById("scientificButtons");

            if (calculator.classList.contains("landscape")) {
                calculator.classList.remove("landscape");
                scientificButtons.style.display = "none";
            } else {
                calculator.classList.add("landscape");
                scientificButtons.style.display = "grid";
            }
        }
    </script>
</body>
</html>
