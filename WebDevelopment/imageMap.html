<html>
<head>
<title>HTML ImageMap</title>
<style>
area:hover {
	background : black;
}
</style>
</head>
<body>
<h1>Interactive Image with ImageMaps</h1>
<img src="C:\practical codes\web tech\worldMap.jpg" usemap="#worldMap" width="600px">
<map name="#worldMap">
<area shape="rect" coords="50,50,150,150" href="https://www.youtube.com/">
<area shape="circle" coords="300,150,50" href="https://open.spotify.com/">
<area shape="poly" coords="400,200,500,250,450,300" href="https://www.google.com">
<p>Click on the areas on the image to navigate to different websites</p>
</body>
</html>
