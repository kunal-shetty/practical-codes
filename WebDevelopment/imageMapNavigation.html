<!DOCTYPE html>
<html lang="en">
<head>
<style>
div {
	text-align : center;
}
img { 
	border : 5px solid white;
}
p {
	font-size : 20px;
}
</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Imagemap Example</title>
</head>
<body bgcolor = "pink">
<div>
  <h1><u>Interactive Image with Imagemap</u></h1>
  <img src="World_Map.png" alt="World Map" usemap="#worldmap" width="600">
  <map name="worldmap">
    <area shape="rect" coords="50,50,150,150" href="https://www.google.com" alt="Google">
    <area shape="circle" coords="300,150,50" href="https://www.bing.com" alt="Bing">
    <area shape="poly" coords="400,200,500,250,450,300" href="https://www.yahoo.com" alt="Yahoo">
  </map>
  <p>Click the areas on the image to navigate to different websites!</p>
</div>
</body>
</html>
